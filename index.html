<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poke-TP</title>

    

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    


</head>


<body class="d-flex flex-column min-vh-100">

    
    <header>
       
            <nav class=" py-1 navbar navbar-expand-lg navbar-dark bg-secondary">
                 <div class="container">
                     <a class="navbar-brand" href="#hero">Pokedex UNLZ </a>
                 </div>
    

             </nav>  
        
        </div>

        
    </header>

    <main class="flex-grow-1">

        <section class="pt-5 pb-3 mt-3 text-center bg-success-subtle">
            <div class="container" >
                <span class="border border-1">
                     <h1> Buscador de pokemones </h1>
                         <div class="row justify-content-center mt-4">
                             
                            <div class="input-group mb-3">
                                <input type="text" class="form-control border-success" placeholder="Buscar pokemon por nombre o numero" aria-label="nombrePokemon"  id="inputPokemon">
                                <button class="btn btn-outline-success" type="button" id="btnBuscar">Buscar</button>
                                
                                <button class="btn btn-outline-danger" type="button" id="btnVolver">Volver</button>

                            </div>
                           
                        </div>
                </span>
            </div>
        </section>

        <section class="pt-5 pb-3 mt-3 text-center">
            <div class="container" >
                   <div id="spinner" class="text-center my-5 d-none">
                         <div  class="spinner-border text-primary"  role="status">
                                <span class="visually-hidden">
                                    Cargando...
                                </span>
                        </div>

                     </div>

             <div class="row row-cols-1 row-cols-md-5 g-4" id="resultado"></div>
           

        </section>

    </main>
    
    <section>
        <main> 
            
       
        <footer class="bg-secondary text-light py-1">
            <div class="container">
                <div class="row align-items-center">

                    <div class="col-md-2 text-center text-md-start ">
                        <h3 class="h4 mb-3"> "Aplicaciones web" </h3>
                    </div>
                
                </div>

            </div>
        
         </footer>
     </section>
     </main>
     
     <!-- alertas -->
     <template id="templateErrorPokemon">
        <swal-title>
            Pokemon no encontrado
        </swal-title>
        <swal-icon type="warning" color="red"></swal-icon>
        <swal-button type="confirm" color="red">
            Volver
        </swal-button>
        <swal-param name="allowOutsideClick" value="false"></swal-param>


    </template>

    <template id="templateInputVacio">
        <swal-title>
            Debe ingresar nombre o nro de pokemon
        </swal-title>
        <swal-icon type="warning" color="red"></swal-icon>
        <swal-button type="confirm" color="red">
            Volver
        </swal-button>
        <swal-param name="allowOutsideClick" value="false"></swal-param>


    </template>




     
     <script type="module" src="js/main.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
